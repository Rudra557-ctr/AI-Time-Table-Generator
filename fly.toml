app = "sih-timetable-usar"
primary_region = "bom"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[mounts]
  source = "sih_uploads"
  destination = "/app/uploads"
